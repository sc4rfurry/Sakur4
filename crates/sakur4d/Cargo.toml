[package]
name = "sakur4d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sakur4 daemon: MCP gateway + sidecar for the Sakur4 memory/context OS."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "sakur4d"
path = "src/main.rs"

[features]
# Forwarded so `sakur4d gen-key` can exist. The key generator lives in `sakur4-core` behind this
# feature, because a build without SQLCipher cannot open an encrypted store — so `gen-key` has
# nothing to offer without it, and `--features encryption` is what turns both on together.
#
# Without this declaration the `cfg(feature = "encryption")` in `cli.rs` was an undeclared
# condition: it compiled, printed two warnings, and the branch it guards could never be taken,
# because nothing could enable a feature this manifest did not name.
encryption = ["sakur4-core/encryption"]

[dependencies]
sakur4-core.workspace = true

tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

rmcp.workspace = true
axum = "0.8"
# Needed by the reverse proxy (FR-18), which forwards to the real inference server.
reqwest.workspace = true
parking_lot.workspace = true
blake3.workspace = true
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
http = "1"
schemars.workspace = true

anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = "0.8"
# Needed by the reverse proxy (FR-18), which forwards to the real inference server.
reqwest.workspace = true
parking_lot.workspace = true
blake3.workspace = true
tempfile.workspace = true
sakur4-testkit.workspace = true
