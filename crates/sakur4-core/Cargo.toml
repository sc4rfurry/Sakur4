[package]
name = "sakur4-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sakur4 core: Memory Fabric, Graduated Eviction Engine, Cache-Coherence Layer, Repo Cortex."
# Inherited explicitly rather than assumed. A published manifest that has lost its
# repository URL is a crate nobody can find the source of, and crates.io pages
# read better with a README.
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = []
# Optional encryption at rest (FR-20).
#
# Switches the bundled SQLite for SQLCipher, which is what makes `PRAGMA key` mean
# anything. Off by default, and deliberately so:
#
# * It replaces the SQLite library the whole crate is built against, so it is not a
#   change to take on behalf of every user.
# * Development builds stay fast. SQLCipher is a full C library compile, and the
#   vendored variant additionally compiles OpenSSL.
# * A store written by an encrypted build is unreadable by a plain one, so mixing the
#   two in a workspace produces a store that opens in `cargo test` and not in a
#   release.
#
# # Platform support, which is not uniform
#
# `bundled-sqlcipher` compiles SQLCipher but links the **system** OpenSSL:
#
#   Linux    works. `libssl-dev` is on most images and is one apt install otherwise.
#            This is what CI verifies.
#   macOS    works with `brew install openssl` if it is not already present.
#   Windows  needs the OpenSSL **development** files — headers and import libraries,
#            not just the runtime. The common ShiningLight installer ships DLLs only
#            and fails with a message about a missing include directory.
#
# The vendored variant (`bundled-sqlcipher-vendored-openssl`) was tried and rejected.
# Compiling OpenSSL needs a complete Perl and NASM on PATH, and a stock Windows
# machine has neither. Git for Windows ships a Perl, but it is an msys subset missing
# `Locale::Maketext::Simple`, so it fails inside OpenSSL's own `Configure` with an
# error about a Perl module. Publishing a feature that fails to build for most people
# who enable it would be worse than documenting the OpenSSL requirement, which at
# least names something the user can install.
#
# The tests in `tests/encryption_at_rest.rs` are gated on this feature, so the suite
# states which build it verified rather than passing vacuously without it.
encryption = ["rusqlite/bundled-sqlcipher"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
parking_lot.workspace = true

rusqlite.workspace = true

serde.workspace = true
serde_json.workspace = true
toml.workspace = true
schemars.workspace = true

blake3.workspace = true
uuid.workspace = true
chrono.workspace = true

tree-sitter.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-go.workspace = true
ignore.workspace = true

reqwest.workspace = true

thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
