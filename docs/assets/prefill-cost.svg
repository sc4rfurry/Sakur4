<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d">
  <title id="t">Why prefix preservation determines prefill cost</title>
  <desc id="d">A summarising compaction rewrites the prompt so the server's cache matches nothing and the whole context is processed again. Sakur4's eviction preserves a byte-identical prefix, so that portion is skipped: of 17114 prompt tokens, 4034 were reused and 13080 prefilled, avoiding 24 percent of the work.</desc>
  <defs>
    <marker id="dim-s" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M6 0L0 3L6 6" fill="none" stroke="#22d3ee" stroke-width="1"/></marker>
    <marker id="dim-e" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#22d3ee" stroke-width="1"/></marker>
  </defs>

  <defs>
    <pattern id="cost-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16202c" stroke-width="1"/>
    </pattern>
    <pattern id="cost-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#16202c"/>
    </pattern>
    <radialGradient id="cost-vig" cx="50%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#0f1720" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05080b" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="cost-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!--
      Two off-centre washes and a hairline edge, shared by every figure.

      A single centred glow made the whole set read as evenly lit, which is what makes a diagram
      look generated rather than drawn: with no light direction there is no sense of a surface.
      Two washes — cyan where the title sits, violet at the opposite corner — give the eye a
      direction to follow, and the hairline stops the top edge dissolving into the page.
    -->
    <radialGradient id="cost-washA" cx="16%" cy="8%" r="64%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cost-washB" cx="86%" cy="97%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cost-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="520" fill="#0b0f14"/>
  <rect width="1280" height="520" fill="url(#cost-washA)"/>
  <rect width="1280" height="520" fill="url(#cost-washB)"/>
  <rect width="1280" height="520" fill="url(#cost-grid)" opacity="0.55"/>
  <rect width="1280" height="520" fill="url(#cost-vig)"/>
  <rect x="0" y="0" width="1280" height="2" fill="url(#cost-edge)"/><text x="64" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e8eef6" text-anchor="start" opacity="1">Why the prefix is the whole game</text><text x="64" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5d7089" text-anchor="start" opacity="1">Prompt processing is not incremental. A cache hit skips work; a miss repeats it, at full price.</text><text x="64" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e8eef6" text-anchor="start" opacity="1">Summarising compaction</text><text x="980" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f87171" text-anchor="start" opacity="1">100% of the prompt processed</text><rect x="64" y="148" width="900" height="52" rx="6" fill="#111823" stroke="#1e2a3a"/><rect x="64" y="148" width="900" height="52" rx="6" fill="#f87171" opacity="0.28" stroke="#f87171" stroke-width="1"/><text x="80" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e8eef6" text-anchor="start" opacity="1">every token reprocessed from scratch</text><text x="64" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e8eef6" text-anchor="start" opacity="1">Sakur4 eviction</text><text x="980" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#34d399" text-anchor="start" opacity="1">76% of the prompt processed</text><rect x="64" y="256" width="900" height="52" rx="6" fill="#111823" stroke="#1e2a3a"/><rect x="64" y="256" width="684" height="52" rx="6" fill="#34d399" opacity="0.28" stroke="#34d399" stroke-width="1"/><text x="80" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#e8eef6" text-anchor="start" opacity="1">the preserved head is skipped entirely</text><rect x="64" y="380" width="1152" height="100" rx="12" fill="#0d1319" stroke="#1e2a3a" stroke-width="1"/><text x="88" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#96a7bd" text-anchor="start" opacity="1">Measured on a 32K-window session</text><text x="88" y="448" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#34d399" text-anchor="start" opacity="1">4034</text><text x="158" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5d7089" text-anchor="start" opacity="1">tokens reused</text><text x="388" y="448" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#fbbf24" text-anchor="start" opacity="1">13080</text><text x="473" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5d7089" text-anchor="start" opacity="1">tokens prefilled</text><text x="688" y="448" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" font-weight="700" fill="#22d3ee" text-anchor="start" opacity="1">24%</text><text x="743" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5d7089" text-anchor="start" opacity="1">prefill avoided</text><text x="88" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5d7089" text-anchor="start" opacity="1">Produced by `sakur4d demo`; the receipt prints in full with `context.receipt`.</text>
</svg>
