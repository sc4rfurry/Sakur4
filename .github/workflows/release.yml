name: Release

# Triggered by a version tag. The release workflow does three things, in order of
# how much they would hurt to get wrong:
#
#  1. Re-runs the full test suite against the tagged commit. A tag can point at
#     anything; the release must not.
#  2. Builds prebuilt binaries for the three platforms the PRD names.
#  3. Publishes the GitHub release with those binaries and generated notes.
#
# Publishing to crates.io is deliberately *not* automatic. It is irreversible
# (a yanked version stays yanked, and the name stays taken), so it belongs behind
# a human decision. The `package` job below verifies the crates are publishable,
# and the README documents the one command that pushes them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not create a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # # SQLCipher's crypto provider has to resolve, even to lint
      #
      # `--all-features` turns on the `encryption` feature, whose build script needs OpenSSL's
      # development files. Without them this step dies inside a C build script with
      # `OPENSSL_DIR is not set`, which reads as a lint failure and is not one.
      #
      # The CI workflow documents this trap and installs libssl-dev for exactly this reason.
      # This workflow ran the same command without it, so the first release would have failed
      # at its first verification step — before building anything, and with a message pointing
      # at the linter rather than at the missing package.
      - name: Install SQLCipher's crypto provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo build --workspace --bins
      - run: cargo test --workspace --all-targets
      # `sakur4-core` must be publishable before it can go to crates.io; and it
      # must go first, because `sakur4d` depends on it by version.
      - run: cargo publish -p sakur4-core --dry-run --allow-dirty

  # ---------------------------------------------------------------------------
  # Prebuilt binaries. A user on a machine without a Rust toolchain should be
  # able to download `sakur4d` and run it — which is also what makes the MCP
  # integration path one step instead of two.
  # ---------------------------------------------------------------------------
  binaries:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-linker (aarch64 Linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p sakur4d

      # The archive carries the skill alongside the binary, so a download is a
      # complete install: `sakur4d` on PATH, and `skills/sakur4/` ready to copy
      # into `~/.agents/skills/` or point a harness at.
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="sakur4d-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/sakur4d" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/" 2>/dev/null || true
          cp -r skills "dist/$name/" 2>/dev/null || true
          cp -r integrations "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "sakur4d-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sakur4d.exe" "dist/$name/"
          foreach ($f in 'README.md','LICENSE','CHANGELOG.md') {
            if (Test-Path $f) { Copy-Item $f "dist/$name/" }
          }
          foreach ($d in 'skills','integrations') {
            if (Test-Path $d) { Copy-Item $d "dist/$name/" -Recurse }
          }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          "ASSET=dist/$name.zip" | Out-File -Append -FilePath $env:GITHUB_ENV

      # A checksum per artifact, so a downloader can verify what they got.
      #
      # # Record bare filenames
      #
      # `sha256sum ./*.tar.gz` writes `hash  *./name` — a leading `*` for binary mode plus a
      # `./` prefix — and `install.sh` looks its archive up by name. Shipping that form meant
      # the installer could not find any archive it was asked to verify, and refused every
      # install with "not listed in SHA256SUMS.txt" while looking like a corrupt download.
      #
      # Passing bare names through `xargs` gives `hash  name`, which is what the installer
      # parses and what `sha256sum -c` expects.
      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt
          ls -1 ./*.tar.gz ./*.zip 2>/dev/null | sed 's|^\./||' | sort > .assets
          if command -v sha256sum >/dev/null 2>&1; then
            xargs -a .assets sha256sum > SHA256SUMS.txt
          elif command -v shasum >/dev/null 2>&1; then
            xargs -a .assets shasum -a 256 > SHA256SUMS.txt
          else
            echo "::error::no checksum tool available; the release would be unverifiable"
            exit 1
          fi
          rm -f .assets
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sakur4d-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The GitHub release itself.
  # ---------------------------------------------------------------------------
  publish:
    name: publish GitHub release
    needs: binaries
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          # # One checksum file, not one per platform
          #
          # Each matrix job writes its own `SHA256SUMS.txt` covering only the archive it just
          # built, and `download-artifact` with `merge-multiple` drops them all into one
          # directory. Copying them the same way the archives are copied meant four of the five
          # were silently overwritten and the published checksum file listed exactly one
          # platform.
          #
          # That is not cosmetic. `install.sh` refuses to install an archive that is not listed
          # in `SHA256SUMS.txt` — deliberately, because an installer that skips verification is
          # worse than no installer — so four of five platforms would have failed to install
          # with "not listed in SHA256SUMS.txt" on the first release.
          #
          # Concatenating is correct here because the entries are `hash  filename` lines and the
          # filenames are unique per platform. Sorting keeps the file stable between runs.
          if compgen -G 'artifacts/**/SHA256SUMS.txt' >/dev/null 2>&1; then
            find artifacts -name 'SHA256SUMS.txt' -exec cat {} + | sort -k2 > release/SHA256SUMS.txt
          else
            # Some matrix entries may not generate one; derive them from the assets instead of
            # shipping a release with no verification at all.
            (cd release && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt)
          fi
          echo "--- checksum coverage ---"
          wc -l < release/SHA256SUMS.txt
          ls -la release/

      # The guard for the bug above: every published archive must appear in the published
      # checksum file. Without this the mistake is invisible until a user on an unlisted
      # platform runs the installer and is refused — which reads as the installer being broken
      # rather than the release being incomplete.
      - name: Every archive is covered by a checksum
        run: |
          set -euo pipefail
          missing=0
          for asset in release/*.tar.gz release/*.zip; do
            [ -e "$asset" ] || continue
            name="$(basename "$asset")"
            if ! awk -v f="$name" '$2 == f || $2 == "*"f { found = 1 } END { exit !found }' release/SHA256SUMS.txt; then
              echo "::error::$name has no entry in SHA256SUMS.txt; the installer will refuse it"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "SHA256SUMS.txt contents:"
            cat release/SHA256SUMS.txt
            exit 1
          fi
          echo "all $(ls release/*.tar.gz release/*.zip 2>/dev/null | wc -l) archives are covered"

      # Verified against the real artifacts, not a fixture. A checksum file that lists the
      # right names but the wrong hashes is worse than one that lists nothing, because it looks
      # like verification happened.
      - name: The checksums match the archives
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt

      - name: Extract the changelog section for this tag
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            # Stop at the next version heading *or* at the link-definition block at
            # the bottom of the file, which is bookkeeping rather than notes.
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section found for ${version}; using generated notes." >&2
            echo "" > notes.md
          fi
          {
            cat notes.md
            echo ""
            echo "---"
            echo ""
            echo "### Installing"
            echo ""
            echo 'Download the archive for your platform, then:'
            echo ""
            echo '```bash'
            echo './sakur4d --version'
            echo './sakur4d --db :memory: doctor'
            echo '```'
            echo ""
            echo "Or build from source with \`cargo build --release\` (Rust 1.94+)."
            echo ""
            echo "### Using it from a harness"
            echo ""
            echo '```bash'
            echo '# Print ready-to-paste MCP configuration'
            echo './sakur4d config hermes'
            echo './sakur4d config claude'
            echo './sakur4d config generic-stdio'
            echo '```'
          } > release-notes.md
          wc -l release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
