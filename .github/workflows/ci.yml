name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: a push to a branch with an in-flight
# run makes that run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI even where a developer's local build would not, so a
  # warning cannot be merged and then discovered during a release.
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Formatting and lints: fast, and the cheapest place to catch a mistake.
  # ---------------------------------------------------------------------------
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # `--all-features` deliberately, and the encryption feature must therefore be
      # lint-clean too — but linting it needs SQLCipher's crypto provider to *resolve*,
      # which is why libssl-dev is installed here as well as in the encryption job.
      # Without it this step fails inside a C build script with `OPENSSL_DIR is not
      # set`, which reads as a lint failure and is not one.
      - name: Install SQLCipher's crypto provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  # ---------------------------------------------------------------------------
  # Tests on every supported platform.
  #
  # The PRD's NFR-8 names Linux and macOS as v1 targets with Windows via WSL2,
  # but Windows is *also* where this project is developed and where the stdio
  # transport's newline and path handling is most likely to differ. Testing all
  # three is cheaper than finding out later.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The stdio integration tests spawn the real `sakur4d` binary, so it has to
      # exist before `cargo test` runs. `cargo test` would normally build it as a
      # dependency of the integration test, but building it explicitly makes a
      # compile failure here unmistakable rather than surfacing as a test panic.
      - name: Build binaries
        run: cargo build --workspace --bins

      - name: Test
        run: cargo test --workspace --all-targets

      # The crate must build with no default features removed and with the
      # documented minimum toolchain; `rust-version` in Cargo.toml is a promise.
      - name: Verify the declared minimum toolchain
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - name: Build on MSRV
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --workspace

  # ---------------------------------------------------------------------------
  # Encryption at rest (FR-20), an opt-in feature that needs its own job.
  #
  # Two reasons it is not folded into `test`:
  #
  #  1. It swaps the bundled SQLite for SQLCipher, so it cannot share a build with
  #     the default feature set — a store written by one is unreadable by the other.
  #  2. Its tests are `#![cfg(feature = "encryption")]`, so without this job they
  #     would never run anywhere and the suite would pass while verifying nothing.
  #
  # Linux only, because that is where the requirement is satisfiable without asking
  # anyone to install anything. The feature's platform notes live in
  # `crates/sakur4-core/Cargo.toml`; Windows needs OpenSSL development files, which a
  # default CI runner does not have.
  # ---------------------------------------------------------------------------
  encryption:
    name: encryption at rest (FR-20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: encryption
      - name: Install SQLCipher's crypto provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - name: Build with the encryption feature
        run: cargo build -p sakur4-core --features encryption
      - name: Verify the acceptance criterion
        run: cargo test -p sakur4-core --features encryption --test encryption_at_rest

  # ---------------------------------------------------------------------------
  # The Hermes ContextEngine (FR-16), which is Python and lives outside the Rust
  # workspace.
  #
  # `verify_engine.py` exercises the engine against a *live* daemon rather than a mock,
  # because the engine's whole job is to talk to a running process and satisfy an
  # interface Hermes owns. That means this job has to start one.
  #
  # The window is deliberately small. The daemon plans against the backend's reported
  # window, and the embedded backend simulates 32,768 — so the test's synthetic history
  # would sit below the trigger, the plan would correctly reclaim nothing, and the job
  # would fail for a reason that has nothing to do with the engine.
  # ---------------------------------------------------------------------------
  hermes-engine:
    name: Hermes context engine (FR-16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the daemon
        run: cargo build --release -p sakur4d

      - name: Start a daemon for the engine to talk to
        run: |
          ./target/release/sakur4d --db /tmp/hermes-engine.db --backend embedded \
            --context-window 8192 serve --transport http --bind 127.0.0.1:8770 --no-dream &
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8770/ 2>/dev/null || \
               curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8770/ | grep -qE '^[24]'; then
              echo "daemon up"; break
            fi
            sleep 0.5
          done

      # The engine imports `agent.context_engine`, which only exists inside Hermes. CI
      # does not have Hermes, so the interface is stubbed: the contract under test is
      # this engine's behaviour, not Hermes'.
      - name: Stub the Hermes interface
        run: |
          mkdir -p /tmp/hermes-stub/agent
          cat > /tmp/hermes-stub/agent/__init__.py <<'PY'
          PY
          cat > /tmp/hermes-stub/agent/context_engine.py <<'PY'
          """Minimal stand-in for Hermes' ContextEngine ABC.

          Only the surface this engine implements: the abstract methods plus the
          documented attributes run_agent.py reads directly. Enough to import and
          instantiate; the real class adds helpers this engine does not use.
          """
          from abc import ABC, abstractmethod
          from typing import Any, Dict, List, Optional


          class ContextEngine(ABC):
              last_prompt_tokens: int = 0
              last_completion_tokens: int = 0
              last_total_tokens: int = 0
              threshold_tokens: int = 0
              context_length: int = 0
              compression_count: int = 0
              threshold_percent: float = 0.75
              protect_first_n: int = 3
              protect_last_n: int = 6
              emit_automatic_compaction_status: bool = True

              @property
              @abstractmethod
              def name(self) -> str: ...

              @abstractmethod
              def update_from_response(self, usage: Dict[str, Any]) -> None: ...

              @abstractmethod
              def should_compress(self, prompt_tokens: Optional[int] = None) -> bool: ...

              @abstractmethod
              def compress(self, messages: List[Dict[str, Any]], current_tokens: Optional[int] = None,
                           focus_topic: Optional[str] = None, force: bool = False,
                           memory_context: str = "") -> List[Dict[str, Any]]: ...

              def on_session_start(self, session_id: str, **kwargs: Any) -> None: ...
              def on_session_reset(self) -> None: ...
              def update_model(self, model: Any = None, **kwargs: Any) -> None: ...
          PY

      - name: Verify the engine against the live daemon
        env:
          SAKUR4_URL: http://127.0.0.1:8770
          HERMES_AGENT_DIR: /tmp/hermes-stub
          SAKUR4_HERMES_PLUGIN: ${{ github.workspace }}/integrations/hermes-plugin
        run: python integrations/hermes-plugin/verify_engine.py

  # ---------------------------------------------------------------------------
  # One command that runs everything, so a contributor and CI check the same thing.
  #
  # The jobs above each cover a slice, and their separation is deliberate: a platform
  # matrix, an MSRV build, and an encryption feature that cannot share a build with the
  # default one. This job exists so there is also a single answer to "does it all still
  # work", which is the question a person actually asks — and so that a check added to
  # `verify.mjs` cannot be silently missing from CI.
  #
  # `--require-all` is the point: it turns a skip into a failure. Without it, a runner
  # missing a dependency would report a clean run having verified nothing.
  # ---------------------------------------------------------------------------
  consolidated:
    name: verify.mjs (--require-all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install the encryption feature's crypto provider
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev python3

      # The verifier runs the live-server and harness checks only when asked. On CI there is
      # no llama.cpp and no OMP, so those groups must be told to stand down rather than
      # being quietly skipped by `--require-all`, which would defeat its purpose.
      - name: Verify everything CI can reach
        run: |
          node verify.mjs \
            --only rust,encryption,hermes,bench,harness \
            --require-all \
            --json /tmp/verify.json

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: /tmp/verify.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Documentation: warn-free rustdoc, and doctests actually executed.
  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --no-deps
      - name: doctests
        run: cargo test --workspace --doc

  # ---------------------------------------------------------------------------
  # Release build, as a smoke test that the optimised profile links.
  #
  # `lto = "thin"` and `codegen-units = 1` are release-only settings, so a
  # release-only link error would otherwise be discovered at tag time.
  # ---------------------------------------------------------------------------
  release-build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Smoke-test the binary
        run: |
          ./target/release/sakur4d --version
          ./target/release/sakur4d --db :memory: doctor

  # ---------------------------------------------------------------------------
  # The crates must be publishable.
  #
  # This is not `cargo package --workspace`. `sakur4d` depends on `sakur4-core`
  # by version *and* path, so it cannot be packaged until `sakur4-core` exists on
  # crates.io — a real ordering constraint that a naive check would report as a
  # mysterious failure. So this job verifies the two things that are actually
  # verifiable before a first publish:
  #
  #   * `sakur4-core` fully: `cargo publish --dry-run` extracts the archive,
  #     builds it in isolation, and stops just short of uploading.
  #   * every member's manifest and file list, via `cargo package --list`.
  # ---------------------------------------------------------------------------
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: sakur4-core is publishable
        run: cargo publish -p sakur4-core --dry-run --allow-dirty

      - name: every manifest packages a sane file list
        run: |
          for p in sakur4-core sakur4d sakur4-testkit; do
            echo "--- $p ---"
            cargo package -p "$p" --list --allow-dirty >/dev/null
          done
