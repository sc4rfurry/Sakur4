[workspace]
resolver = "3"
members = ["crates/sakur4-core", "crates/sakur4d", "crates/sakur4-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
license-file = "LICENSE"
repository = "https://github.com/sc4rfurry/Sakur4"
homepage = "https://github.com/sc4rfurry/Sakur4"
documentation = "https://docs.rs/sakur4-core"
readme = "README.md"
keywords = ["mcp", "llm", "agent", "memory", "llama-cpp"]
categories = ["development-tools", "command-line-utilities"]
description = "Sakur4 — a cache-coherent memory and context operating system for local coding/research agents. Ships as an MCP server plus companion backends."
authors = ["Sakur4 contributors"]

[workspace.metadata.release]
# `cargo-release` is optional, but the intent is recorded here so a maintainer
# does not have to guess the policy: bump versions, regenerate the changelog, and
# let CI publish the GitHub release on the tag.
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\nNothing yet.\n\n## [{{version}}] - {{date}}" },
]
tag-prefix = "v"
push-remote = "origin"
consolidate-commits = false

[workspace.dependencies]
# Path *and* version: `cargo package` resolves the version when building the
# published archive, so a bare path dependency makes the crate unpublishable.
sakur4-core = { version = "0.1.0", path = "crates/sakur4-core" }
sakur4-testkit = { version = "0.1.0", path = "crates/sakur4-testkit" }

# --- core runtime ---
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1.12"
parking_lot = "0.12"

# --- storage ---
rusqlite = { version = "0.40", features = ["bundled", "blob", "functions", "hooks", "load_extension", "serde_json", "chrono", "uuid", "limits"] }

# --- serialization / config ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
schemars = { version = "1.2", features = ["derive"] }

# --- hashing / ids / time ---
blake3 = "1.8"
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
humantime = "2.4"

# --- code intelligence ---
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
ignore = "0.4"
walkdir = "2.5"
notify = "9.0.0-rc.5"
notify-debouncer-full = "0.7"
rayon = "1.12"

# --- http client (llama.cpp + embeddings) ---
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "http2"] }

# --- MCP ---
# The `transport-streamable-http-client-reqwest` and `client` features are for
# Sakur4's own integration tests, which drive the gateway over a real HTTP
# listener with the SDK's client. Testing the tool surface through the
# production transport is the only way to catch JSON-RPC framing and
# protocol-negotiation regressions that a handler-level unit test skips.
rmcp = { version = "3.3", features = [
    "server",
    "client",
    "transport-io",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    "macros",
    "schemars",
] }

# --- errors / logging / cli ---
anyhow = "1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }

# --- dev ---
tempfile = "3.27"
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
